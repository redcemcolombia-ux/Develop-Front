<header class="topbar mb-3">
  <div class="left d-flex align-items-center gap-3">
    <button class="icon-btn" type="button" (click)="onToggleMenu()" title="Toggle menu">☰</button>
  </div>

  <div class="right d-flex align-items-center gap-3">
    <div class="session-info d-flex align-items-center gap-2">
      <div class="session-status text-success">
        <span class="ms-1">Conectado</span>
      </div>
    </div>

    <!-- Notificaciones (solo para Cliente Admin) -->
    <div class="notifications position-relative" *ngIf="isClienteAdmin">
      <button
        type="button"
        class="platform-icon-btn position-relative"
        (click)="toggleNotificaciones()"
        [attr.aria-label]="'Notificaciones'"
        [title]="'Notificaciones'"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"
          />
        </svg>
        <span
          *ngIf="totalNotificaciones > 0"
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          style="font-size: 0.65rem;"
        >
          {{ totalNotificaciones }}
        </span>
      </button>

      <!-- Dropdown de notificaciones -->
      <div
        *ngIf="mostrarDropdown"
        class="notifications-dropdown position-absolute border rounded shadow-lg"
        style="right: 0; top: 100%; margin-top: 0.5rem; width: 350px; max-height: 400px; overflow-y: auto; z-index: 1050; background: var(--bs-body-bg); color: var(--bs-body-color);"
      >
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
          <h6 class="mb-0">Notificaciones</h6>
          <div class="d-flex gap-2">
            <button
              type="button"
              class="btn btn-sm btn-link text-decoration-none p-0"
              (click)="recargarNotificaciones()"
              [title]="'Recargar notificaciones'"
              style="color: var(--bs-body-color);"
            >
              🔄
            </button>
            <button
              type="button"
              class="btn btn-sm btn-link text-decoration-none p-0"
              (click)="cerrarDropdown()"
              style="color: var(--bs-body-color);"
            >
              ✕
            </button>
          </div>
        </div>

        <div *ngIf="notificaciones.length === 0" class="p-3 text-center text-muted">
          No hay notificaciones
        </div>

        <div *ngIf="notificaciones.length > 0">
          <div
            *ngFor="let notif of notificaciones"
            class="notification-item p-3 border-bottom"
            (click)="verNotificacion(notif)"
          >
            <div class="d-flex justify-content-between align-items-start">
              <div class="flex-grow-1">
                <p class="mb-1 fw-semibold" style="font-size: 0.9rem;">{{ getNombreCompleto(notif) }}</p>
                <p class="mb-1 text-muted" style="font-size: 0.85rem;">Documento: {{ notif.DOCUMENTO }}</p>
                <p class="mb-1" style="font-size: 0.85rem;">Se actualizó información del aspirante</p>
                <small class="text-muted">{{ formatearFecha(notif.updatedAt) }}</small>
              </div>
              <span class="badge bg-info ms-2" style="font-size: 0.7rem;">
                <i class="bi bi-bell"></i>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="theme-toggle d-flex align-items-center">
      <button
        type="button"
        class="platform-icon-btn platform-theme-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="themeLabel()"
        [title]="themeLabel()"
      >
        <svg *ngIf="!isDarkMode()" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M21.64 13a1 1 0 0 0-1.05-.14 8 8 0 0 1-10.45-10.45 1 1 0 0 0-1.19-1.19A10 10 0 1 0 22.83 14.1a1 1 0 0 0-1.19-1.1z"
          />
        </svg>
        <svg *ngIf="isDarkMode()" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M6.76 4.84l-1.8-1.79L3.17 4.84l1.79 1.8zm10.45 14.32l1.79 1.8l1.79-1.8l-1.79-1.79zM12 4a1 1 0 0 0 1-1V1h-2v2a1 1 0 0 0 1 1zm0 18a1 1 0 0 0-1 1v2h2v-2a1 1 0 0 0-1-1zM4 11H2v2h2a1 1 0 0 0 0-2zm18 0a1 1 0 0 0 0 2h2v-2zM6.76 19.16l-1.8 1.8l1.8 1.79l1.79-1.79zm12.4-12.52l1.79-1.8l-1.79-1.79l-1.8 1.79zM12 6a6 6 0 1 0 6 6a6 6 0 0 0-6-6z"
          />
        </svg>
      </button>
    </div>

    <div class="user d-flex align-items-center gap-2">
      <div class="avatar">{{ initials() }}</div>
      <div class="name">{{ displayName }}</div>
    </div>

    <div class="actions d-flex align-items-center gap-2">
      <button
        class="btn btn-sm btn-primary topbar__logout-btn"
        type="button"
        (click)="logout()"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
      >
        <svg class="topbar__logout-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M10 17v-2h4v-6h-4V7l-5 5zm9-13H5c-1.1 0-2 .9-2 2v4h2V6h14v12H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2"
          />
        </svg>
        <span class="topbar__logout-text ms-1">Cerrar Sesión</span>
      </button>
    </div>
  </div>
</header>
